name: Lint
permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:


jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Check whitespace in changed lines
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base="${PR_BASE_SHA}"
            if [[ -z "${base}" ]]; then
              echo "::error::Could not determine the pull request base commit."
              exit 1
            fi
            git cat-file -e "${base}^{commit}"
            git diff --check "${base}" HEAD
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            before="${PUSH_BEFORE_SHA}"
            if [[ -z "${before}" ]]; then
              echo "::error::Could not determine the commit before this push."
              exit 1
            fi

            if [[ "${before}" =~ ^0+$ ]]; then
              # A new branch has no previous commit. Check the current commit,
              # including the root-commit case where there is no parent.
              if git rev-parse --verify --quiet HEAD^ >/dev/null; then
                git diff --check HEAD^ HEAD
              else
                empty_tree="$(git hash-object -t tree /dev/null)"
                git diff --check "${empty_tree}" HEAD
              fi
            else
              git cat-file -e "${before}^{commit}"
              git diff --check "${before}" HEAD
            fi
          else
            echo "::error::Unsupported event: ${EVENT_NAME}"
            exit 1
          fi

      - name: Run markdownlint-cli2
        run: |
          npx --yes markdownlint-cli2 "**/*.md" "!extensions/**"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run ShellCheck on tracked shell scripts
        run: |
          git ls-files -z -- '*.sh' | xargs -0 shellcheck --severity=error

      - name: Check Bash 3.2 compatibility
        run: |
          set -euo pipefail

          pattern='\$\{!?([A-Za-z_][A-Za-z0-9_]*|[0-9]+|[@*#?$!-])(\[[^]]*\])?(\^\^?|,,?)[^}]*\}'
          violations=0

          while IFS= read -r -d '' script; do
            if grep -HnE -- "${pattern}" "${script}"; then
              violations=1
            fi
          done < <(git ls-files -z -- '*.sh')

          if (( violations != 0 )); then
            echo "::error::Found Bash case-conversion parameter expansion that is unsupported by macOS Bash 3.2."
            cat >&2 <<'EOF'
          Use a portable conversion instead, for example:
            upper=$(printf '%s' "$value" | tr '[:lower:]' '[:upper:]')
            lower=$(printf '%s' "$value" | tr '[:upper:]' '[:lower:]')
          EOF
            exit 1
          fi
